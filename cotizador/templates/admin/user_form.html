{% extends "base.html" %}

{% block title %}Crear Usuario{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Crear Nuevo Usuario</h1>
    <a href="{{ url_for('admin.list_users') }}" class="btn btn-sm btn-outline-secondary">Volver a la lista</a>
</div>

<div class="card shadow-sm">
    <div class="card-body p-4">
        <form action="{{ url_for('admin.create_user') }}" method="POST">
            <h5 class="card-title mb-3">Información General</h5>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="nombre_completo" class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" id="nombre_completo" name="nombre_completo" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="rol" class="form-label">Perfil / Rol</label>
                    <select class="form-select" id="rol" name="rol" required>
                        <option selected disabled value="">Seleccione un rol...</option>
                        <option value="ejecutivo">Ejecutivo/a de Ventas</option>
                        <option value="administrador">Administrador/a de Empresa</option>
                    </select>
                </div>
            </div>

            <h5 class="card-title mt-4 mb-3">Credenciales de Acceso</h5>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
            </div>

            <hr class="my-4">
            <div class="d-flex justify-content-end">
                <a href="{{ url_for('admin.list_users') }}" class="btn btn-secondary me-2">Cancelar</a>
                <button type="submit" class="btn btn-primary">Crear Usuario</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
